<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Richmond Live Academy 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0B0B0E;
  --sf:#141419;
  --ink:#F7F7F4;
  --mu:#B7B7C2;
  --ln:#2A2A33;
  --br:#C1123A;
  --bi:#FFFFFF;
  --tl:#F4E7E8;
  --lk:#F7A7B9;
  --ac:#7A1028;
  --sh:#000000;
  --ok:#34D399;
  --er:#FB7185;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#FFF8F8;
    --sf:#FFFFFF;
    --ink:#1C1C22;
    --mu:#66616B;
    --ln:#E9D9DD;
    --br:#C1123A;
    --bi:#FFFFFF;
    --tl:#FFF3F5;
    --lk:#8B1430;
    --ac:#E6B8C0;
    --sh:#221118;
    --ok:#1F7A4A;
    --er:#B42318;
    color-scheme:light
  }
}
:root[data-theme="light"]{
  --bg:#FFF8F8;
  --sf:#FFFFFF;
  --ink:#1C1C22;
  --mu:#66616B;
  --ln:#E9D9DD;
  --br:#C1123A;
  --bi:#FFFFFF;
  --tl:#FFF3F5;
  --lk:#8B1430;
  --ac:#E6B8C0;
  --sh:#221118;
  --ok:#1F7A4A;
  --er:#B42318;
  color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#0B0B0E;
  --sf:#141419;
  --ink:#F7F7F4;
  --mu:#B7B7C2;
  --ln:#2A2A33;
  --br:#C1123A;
  --bi:#FFFFFF;
  --tl:#F4E7E8;
  --lk:#F7A7B9;
  --ac:#7A1028;
  --sh:#000000;
  --ok:#34D399;
  --er:#FB7185;
  color-scheme:dark
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(circle at 100% 0,rgba(193,18,58,.18),transparent 28%),
    radial-gradient(circle at 0 100%,rgba(255,255,255,.06),transparent 32%),
    linear-gradient(180deg,#0B0B0E 0%,#111118 100%);
  color:var(--ink);
  font:16px/1.6 'Barlow',system-ui,sans-serif;
  min-height:100vh;
  background-attachment:fixed
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(135deg,rgba(255,255,255,.035) 0 12%,transparent 12% 24%,rgba(255,255,255,.02) 24% 36%,transparent 36% 100%);
  opacity:.25;
  mix-blend-mode:screen
}
h1,h2,h3{
  font-family:'Anton','Barlow',system-ui,sans-serif;
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:.04em;
  line-height:1.02;
  margin:0 0 .4em
}
h1{font-size:clamp(2.7rem,9vw,4.4rem)}
h1 .o,h2 .o{color:var(--br)}
h2{font-size:2rem}
h3{font-size:1.2rem;letter-spacing:.05em}
main{max-width:960px;margin:0 auto;padding:24px 22px 56px}
main.narrow{max-width:480px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:24px;padding-bottom:24px}
main.narrow form{width:100%;text-align:left}
main.narrow h1{margin-bottom:.3em}
header{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding:14px 22px;
  background:transparent;
  flex-wrap:wrap;
  position:relative
}
header::after{
  content:"";
  position:absolute;
  left:22px;
  top:100%;
  width:180px;
  max-width:50vw;
  height:5px;
  background:linear-gradient(90deg,#ffffff 0 18%,var(--br) 18% 66%,#111 66% 100%);
  transform:skewX(-18deg);
  transform-origin:left;
  margin-top:4px
}
header+main{padding-top:18px}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Anton',system-ui,sans-serif;
  font-size:1.3rem;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-weight:400
}
.brand span{color:var(--br)}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.corner-logo{height:48px;width:auto;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.corner-logo.fixed{position:fixed;top:14px;right:18px;z-index:5;height:56px}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{
  width:100%;
  padding:10px 12px;
  border:1.5px solid var(--ln);
  border-radius:8px;
  background:rgba(255,255,255,.03);
  color:var(--ink)
}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.72}
:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.btn{
  background:linear-gradient(180deg,#D11F4A 0%,#A41135 100%);
  color:var(--bi);
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  padding:10px 18px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
  cursor:pointer;
  white-space:nowrap;
  text-decoration:none;
  display:inline-block;
  box-shadow:0 10px 20px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.05) inset;
  transition:transform .08s,box-shadow .08s,filter .08s
}
.btn:hover{transform:translateY(-1px);filter:saturate(1.06);box-shadow:0 12px 26px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.08) inset}
.btn:active{transform:translateY(1px);box-shadow:0 6px 14px rgba(0,0,0,.18)}
.btn.d{
  background:transparent;
  color:var(--er);
  border:1.5px solid var(--er);
  box-shadow:none
}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn.d.sm{box-shadow:none}
.link{
  background:none;
  border:0;
  color:var(--lk);
  cursor:pointer;
  text-decoration:underline;
  padding:4px;
  font-weight:600
}
.seg,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.seg button,.tabs button{
  border:1px solid var(--ln);
  background:rgba(255,255,255,.03);
  color:var(--ink);
  border-radius:999px;
  padding:8px 16px;
  cursor:pointer;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-size:.88rem
}
.seg .on,.tabs .on{
  background:var(--br);
  color:var(--bi);
  border-color:transparent;
  box-shadow:0 10px 20px rgba(193,18,58,.18)
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:16px}
.card{
  text-align:left;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.08);
  border-top:8px solid hsl(var(--h) 68% 45%);
  border-radius:16px;
  padding:16px;
  cursor:pointer;
  box-shadow:0 16px 40px rgba(0,0,0,.22);
  transition:transform .12s,box-shadow .12s,border-color .12s
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:0 20px 50px rgba(0,0,0,.28);
  border-color:rgba(255,255,255,.14)
}
.card p{margin:0}
.tag{
  display:inline-block;
  align-self:flex-start;
  font-size:.8rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  padding:4px 10px;
  border-radius:999px;
  background:var(--br);
  color:var(--bi)
}
.tag.ok{background:#1D8B55;color:#ECFFF4}
.box{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
  border-left:6px solid var(--br);
  border-radius:14px;
  padding:16px;
  margin:14px 0;
  box-shadow:0 10px 30px rgba(0,0,0,.12)
}
.box p{margin:.3em 0}
form.box{border:1px dashed rgba(255,255,255,.14);border-left:1px dashed rgba(255,255,255,.14);border-radius:16px}
.inline{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.inline input{flex:1;min-width:180px}
.stack{display:grid;gap:10px;margin:12px 0}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
  border-left:6px solid var(--ac);
  border-radius:14px;
  margin:10px 0;
  flex-wrap:wrap
}
.btn-row{width:100%;cursor:pointer;text-align:left}
.mu{color:var(--mu)}.okt{color:var(--ok);font-weight:600}.er{color:var(--er)}.pair{display:flex;gap:8px;flex-wrap:wrap}.stack label{display:grid;gap:4px;font-weight:500}
.empty{
  padding:24px;
  border:1px dashed rgba(255,255,255,.16);
  border-radius:14px;
  color:var(--mu);
  background:rgba(255,255,255,.025)
}
a{color:var(--lk);word-break:break-all}
.sel{width:auto;min-width:170px}
.pw{white-space:pre-wrap}
@media(max-width:600px){
  main{padding:20px 16px 48px}
  header{padding:10px 16px}
  h2{font-size:1.7rem}
  .brand{font-size:1.1rem}
}
</style>

</head>
<body>
<div id="app"></div>
<script>
const KEY='course-portal-v2';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}};
const fd=f=>Object.fromEntries(new FormData(f));
const fmt=t=>t?new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'';
const fmtD=t=>t?new Date(t+'T00:00').toLocaleDateString([], {dateStyle:'medium'}):'';

const API='https://course-portal-api-production.up.railway.app';
let S={courses:[],users:[],enr:[],asg:[],sub:[],ann:[],meet:[]},sess=null,tok=null,ui={tab:'',course:'',err:'',reg:false,editCourse:'',delCourse:''};
try{tok=localStorage.getItem('cp_token')}catch(e){}
async function api(path,method,body){
 const r=await fetch(API+path,{method:method||'GET',headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:body?JSON.stringify(body):undefined});
 const d=await r.json().catch(()=>({}));
 if(!r.ok){const e=new Error(d.error||'Something went wrong. Try again.');e.status=r.status;throw e}
 return d}
function norm(d){for(const k in d){d[k].forEach(r=>{['id','c','g','s'].forEach(f=>{if(r[f]!=null)r[f]=String(r[f])});if(r.mentors)r.mentors=r.mentors.map(String);if(r.at)r.at=new Date(r.at).getTime()})}return d}
async function refresh(){S=norm(await api('/api/data'))}
function setTok(t){tok=t;try{t?localStorage.setItem('cp_token',t):localStorage.removeItem('cp_token')}catch(e){}}
async function act(fn){ui.err='';try{await fn();await refresh()}catch(e){if(e.status===401){setTok(null);sess=null}ui.err=e.message==='Failed to fetch'?'Can’t reach the server. Check your connection and try again.':e.message}render()}
async function start(){
 if(tok){try{const d=await api('/api/me');sess=String(d.id);await refresh()}catch(e){setTok(null);sess=null}}
 render()}
const U=id=>S.users.find(u=>u.id===id);
const C=id=>S.courses.find(c=>c.id===id);
const cnt=cid=>S.enr.filter(e=>e.c===cid).length;
const empty=t=>`<p class="empty">${t}</p>`;
const tabbar=(l,cur)=>`<nav class="tabs">${l.map(([k,t])=>`<button class="${k===cur?'on':''}" data-a="tab" data-v="${k}">${t}</button>`).join('')}</nav>`;
const cap=s=>s[0].toUpperCase()+s.slice(1);

const LOGO=(cls)=>`<img class="corner-logo ${cls||''}" src="${LOGO_SRC}" alt="Richmond Live logo" width="260" height="254">`;

function render(){$('#app').innerHTML=sess&&U(sess)?shell():login()}

function login(){
 return `${LOGO('fixed')}<main class="narrow"><h1>Richmond Live <span class="o">Academy</span></h1><p class="mu">Sign in with the email and password you were given.</p>
 <form data-f="login" class="box stack"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label>${ui.err?`<p class="er" role="alert">${esc(ui.err)}</p>`:''}<button class="btn">Sign in</button></form>
 <p class="mu">No login yet? Ask your course admin.</p></main>`}

function shell(){
 const me=U(sess);
 return `<header><strong class="brand">${esc(me.name)}</strong>${LOGO('fixed')}</header><main>${ui.err?`<p class="er" role="alert">${esc(ui.err)}</p>`:''}${{student,mentor,admin}[me.role]()}</main>`}

/* Student */
function student(){
 const mine=S.enr.filter(e=>e.s===sess).map(e=>e.c);
 if(ui.course&&mine.includes(ui.course)&&C(ui.course))return portal(C(ui.course));
 return `<h2>Our <span class="o">Courses</span></h2><p class="mu">Select a course card to enroll and open its portal.</p><div class="grid">${S.courses.map(c=>{const on=mine.includes(c.id),m=c.mentors.map(U).filter(Boolean);return `<button class="card" style="--h:${c.hue}" data-a="${on?'open':'enroll'}" data-v="${c.id}"><h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p><span class="mu">${m.length?(m.length>1?'Mentors: ':'Mentor: ')+esc(m.map(x=>x.name).join(' and ')):'Mentor to be assigned'}</span><span class="tag ${on?'ok':''}">${on?'Enrolled: open portal':'Enroll'}</span></button>`}).join('')}</div>`}

function portal(c){
 const t=ui.tab||'work';let b='';
 if(t==='work'){
  b=S.asg.filter(a=>a.c===c.id).map(a=>{
   const s=S.sub.find(x=>x.g===a.id&&x.s===sess);
   return `<article class="box"><h3>${esc(a.title)}</h3><p class="pw">${esc(a.desc)}</p>${a.due?`<p class="mu">Due ${fmtD(a.due)}</p>`:''}${s?`<p class="okt">Submitted: <a href="${esc(url(s.link))}" target="_blank" rel="noopener">${esc(s.link)}</a></p>`:''}<form data-f="submit" data-v="${a.id}" class="inline"><input name="link" type="url" placeholder="https://link-to-your-work" required><button class="btn">${s?'Update link':'Submit link'}</button></form></article>`}).join('')||empty('No work assigned yet. Your mentor’s assignments will show up here.')}
 if(t==='meet'){
  b=S.meet.filter(m=>m.c===c.id).map(m=>`<div class="row"><div><h3>${esc(m.title)}</h3><span class="mu">${m.when?fmt(m.when):'Time not set'}</span></div><a class="btn" href="${esc(url(m.url))}" target="_blank" rel="noopener">Join meeting</a></div>`).join('')||empty('No class meetings yet. Links added by your mentor will appear here.')}
 if(t==='news'){
  b=S.ann.filter(n=>n.c===c.id).sort((x,y)=>y.at-x.at).map(n=>`<article class="box"><p class="pw">${esc(n.text)}</p><p class="mu">${fmt(n.at)}</p></article>`).join('')||empty('No announcements yet.')}
 return `<button class="link" data-a="back">← All courses</button><h2>${esc(c.name)}</h2>${tabbar([['work','Assigned work'],['meet','Class meetings'],['news','Announcements']],t)}${b}`}

/* Mentor */
function mentor(){
 const cs=S.courses.filter(c=>c.mentors.includes(sess));
 if(!cs.length)return empty('An admin hasn’t assigned you to a course yet.');
 const c=cs.find(x=>x.id===ui.course)||cs[0];ui.course=c.id;
 const t=ui.tab||'subs',en=S.enr.filter(x=>x.c===c.id).map(x=>U(x.s)).filter(Boolean);
 const as=S.asg.filter(a=>a.c===c.id);let b='';
 if(t==='subs'){
  b=as.map(a=>{const subs=S.sub.filter(x=>x.g===a.id);return `<article class="box"><h3>${esc(a.title)}</h3><p class="mu">${subs.filter(s=>en.some(u=>u.id===s.s)).length} of ${en.length} students submitted</p>${en.map(u=>{const s=subs.find(x=>x.s===u.id);return `<div class="row"><span>${esc(u.name)}</span>${s?`<a href="${esc(url(s.link))}" target="_blank" rel="noopener">View submission</a>`:'<span class="mu">Not submitted</span>'}</div>`}).join('')||'<p class="mu">No students enrolled yet.</p>'}</article>`}).join('')||empty('Assign work first. Student submissions will appear here.')}
 if(t==='assign'){
  b=`<form data-f="asg" class="box stack"><h3>New assignment</h3><input name="title" placeholder="Title" required><textarea name="desc" rows="3" placeholder="Instructions"></textarea><label class="mu">Due date (optional)<input name="due" type="date"></label><button class="btn">Assign to students</button></form>`+as.map(a=>`<div class="row"><div><h3>${esc(a.title)}</h3><span class="mu">${a.due?'Due '+fmtD(a.due):'No due date'}</span></div><button class="btn d sm" data-a="delasg" data-v="${a.id}">Remove</button></div>`).join('')}
 if(t==='meet'){
  b=`<form data-f="meet" class="box stack"><h3>Add a Google Meet link</h3><input name="title" placeholder="Meeting title" required><input name="url" type="url" placeholder="https://meet.google.com/..." required><label class="mu">Date and time (optional)<input name="when" type="datetime-local"></label><button class="btn">Add meeting link</button></form>`+S.meet.filter(m=>m.c===c.id).map(m=>`<div class="row"><div><h3>${esc(m.title)}</h3><span class="mu">${m.when?fmt(m.when):'Time not set'}</span></div><button class="btn d sm" data-a="delmeet" data-v="${m.id}">Remove</button></div>`).join('')}
 if(t==='news'){
  b=`<form data-f="ann" class="box stack"><h3>New announcement</h3><textarea name="text" rows="3" placeholder="Write an announcement for your students" required></textarea><button class="btn">Post announcement</button></form>`+S.ann.filter(n=>n.c===c.id).sort((x,y)=>y.at-x.at).map(n=>`<article class="box"><p class="pw">${esc(n.text)}</p><p class="mu">${fmt(n.at)}</p><button class="btn d sm" data-a="delann" data-v="${n.id}">Remove</button></article>`).join('')}
 return `<h2>${esc(c.name)}</h2><p class="mu">${en.length} students enrolled</p>${cs.length>1?`<div class="seg">${cs.map(x=>`<button class="${x.id===c.id?'on':''}" data-a="course" data-v="${x.id}">${esc(x.name)}</button>`).join('')}</div>`:''}${tabbar([['subs','Submissions'],['assign','Assign work'],['meet','Meet links'],['news','Announcements']],t)}${b}`}

/* Admin */
function courseRow(c,ms){
 if(ui.editCourse===c.id)return `<form data-f="editcourse" data-v="${c.id}" class="box stack"><h3>Edit course</h3><label>Course name<input name="name" value="${esc(c.name)}" maxlength="120" required></label><label>Description<input name="desc" value="${esc(c.desc)}" maxlength="500"></label><div class="inline"><button class="btn">Save changes</button><button type="button" class="btn d" data-a="canceledit">Cancel</button></div></form>`;
 const n=cnt(c.id);
 const sel=`<div class="pair">${[0,1].map(i=>`<select class="sel" data-a="setmentor" data-v="${c.id}" data-i="${i}" aria-label="Mentor ${i+1} for ${esc(c.name)}"><option value="">No mentor ${i+1}</option>${ms.map(m=>`<option value="${m.id}" ${m.id===c.mentors[i]?'selected':''} ${m.id===c.mentors[1-i]?'disabled':''}>${esc(m.name)}</option>`).join('')}</select>`).join('')}</div>`;
 const acts=ui.delCourse===c.id
  ?`<div class="box stack"><p>Remove ${esc(c.name)}? This also deletes its enrollments, assignments, submissions, announcements and meeting links. You can’t undo this.</p><div class="inline"><button class="btn d" data-a="delcourse" data-v="${c.id}">Yes, remove course</button><button class="btn" data-a="canceldel">Keep course</button></div></div>`
  :`<div class="inline"><button class="btn sm" data-a="editcourse" data-v="${c.id}">Edit</button><button class="btn d sm" data-a="askdel" data-v="${c.id}">Remove</button></div>`;
 return `<div class="row"><div><h3>${esc(c.name)}</h3><span class="mu">${n} ${n===1?'student':'students'} enrolled</span></div>${sel}${acts}</div>`}

function admin(){
 const t=ui.tab||'courses',ms=S.users.filter(u=>u.role==='mentor'),ss=S.users.filter(u=>u.role==='student');let b='';
 if(t==='courses'){
  b=S.courses.map(c=>courseRow(c,ms)).join('')+`<form data-f="newcourse" class="box stack"><h3>Add a course</h3><input name="name" placeholder="Course name" required><input name="desc" placeholder="Short description"><button class="btn">Add course</button></form>`}
 if(t==='mentors'){
  b=ms.map(m=>{const cs=S.courses.filter(c=>c.mentors.includes(m.id)).map(c=>c.name);return `<div class="row"><div><h3>${esc(m.name)}</h3><span class="mu">${esc(m.email||'')}</span><br><span class="mu">${cs.length?esc(cs.join(', ')):'No courses assigned'}</span><form data-f="setpw" data-v="${m.id}" class="inline"><input name="pw" type="text" minlength="8" placeholder="New password" required><button class="btn sm">Set password</button></form></div><button class="btn d sm" data-a="delmentor" data-v="${m.id}">Remove mentor</button></div>`}).join('')||empty('No mentors yet.');
  b+=`<form data-f="newmentor" class="box stack"><h3>Add a mentor</h3><input name="name" placeholder="Mentor name" required><label>Email (their username)<input name="email" type="email" required></label><label>Password you give them<input name="password" type="text" minlength="8" required></label><button class="btn">Add mentor</button></form>`}
 if(t==='students'){
  b=ss.map(s=>{const cs=S.enr.filter(e=>e.s===s.id).map(e=>C(e.c)&&C(e.c).name).filter(Boolean);return `<div class="row"><div><h3>${esc(s.name)}</h3><span class="mu">${esc(s.email||'')}</span><br><span class="mu">${cs.length?esc(cs.join(', ')):'Not enrolled in any course'}</span><form data-f="setpw" data-v="${s.id}" class="inline"><input name="pw" type="text" minlength="8" placeholder="New password" required><button class="btn sm">Set password</button></form></div><button class="btn d sm" data-a="delstudent" data-v="${s.id}">Remove student</button></div>`}).join('')||empty('No students yet. Add the first one below.');
  b+=`<form data-f="newstudent" class="box stack"><h3>Add a student</h3><input name="name" placeholder="Student name" required><label>Email (their username)<input name="email" type="email" required></label><label>Password you give them<input name="password" type="text" minlength="8" required></label><button class="btn">Add student</button></form>`}
 return `<h2>Admin<span class="o">istration</span></h2><p class="mu">${S.courses.length} courses, ${ms.length} mentors, ${ss.length} students</p>${tabbar([['courses','Courses'],['mentors','Mentors'],['students','Students']],t)}${b}`}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==='out'){setTok(null);sess=null;ui.err='';ui.tab='';ui.course=''}
 else if(a==='open'){ui.course=v;ui.tab='work';ui.err=''}
 else if(a==='back')ui.course='';
 else if(a==='tab'){ui.tab=v;ui.err='';ui.editCourse='';ui.delCourse=''}
 else if(a==='course'){ui.course=v;ui.tab=''}
 else if(a==='enroll')return act(async()=>{await api(`/api/courses/${v}/enroll`,'POST');ui.course=v;ui.tab='work'});
 else if(a==='delasg')return act(()=>api('/api/assignments/'+v,'DELETE'));
 else if(a==='delmeet')return act(()=>api('/api/meetings/'+v,'DELETE'));
 else if(a==='delann')return act(()=>api('/api/announcements/'+v,'DELETE'));
 else if(a==='delmentor'||a==='delstudent')return act(()=>api('/api/admin/users/'+v,'DELETE'));
 else if(a==='editcourse'){ui.editCourse=v;ui.delCourse='';ui.err=''}
 else if(a==='canceledit')ui.editCourse='';
 else if(a==='askdel'){ui.delCourse=v;ui.editCourse='';ui.err=''}
 else if(a==='canceldel')ui.delCourse='';
 else if(a==='delcourse')return act(async()=>{await api('/api/admin/courses/'+v,'DELETE');ui.delCourse=''});
 else return;
 render()});

document.addEventListener('change',e=>{
 const s=e.target.closest('[data-a="setmentor"]');if(!s)return;
 const c=C(s.dataset.v),i=+s.dataset.i,m=[c.mentors[0]||'',c.mentors[1]||''];m[i]=s.value;
 act(()=>api(`/api/admin/courses/${c.id}/mentors`,'PUT',{mentors:m.filter(Boolean)}))});

document.addEventListener('submit',e=>{
 const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();
 const k=f.dataset.f,d=fd(f),v=f.dataset.v,cid=ui.course;
 const auth=async p=>{const r=await api(p,'POST',d);setTok(r.token);sess=String(r.user.id);ui.tab='';ui.course=''};
 const run={
  login:()=>auth('/api/login'),
  submit:()=>api(`/api/assignments/${v}/submission`,'PUT',{link:d.link}),
  asg:()=>api(`/api/courses/${cid}/assignments`,'POST',{title:d.title,desc:d.desc,due:d.due||null}),
  meet:()=>api(`/api/courses/${cid}/meetings`,'POST',{title:d.title,url:d.url,when:d.when}),
  ann:()=>api(`/api/courses/${cid}/announcements`,'POST',{text:d.text}),
  newmentor:()=>api('/api/admin/mentors','POST',d),
  newstudent:()=>api('/api/admin/students','POST',d),
  setpw:()=>api(`/api/admin/users/${v}/password`,'PUT',{password:d.pw}),
  newcourse:()=>api('/api/admin/courses','POST',{name:d.name,desc:d.desc}),
  editcourse:()=>api(`/api/admin/courses/${v}`,'PUT',{name:d.name,desc:d.desc}).then(()=>{ui.editCourse=''})
 }[k];
 if(run)act(run)});

start();
</script>
</body>
</html>
